schema_version: "0.1"

id: entity_extractor_v01
module: entity_extractor

description: >
  Measures scientific entity extraction quality against manually
  annotated gold entities.

fixtures:
  - id: wikiskill
    input: benchmarks/fixtures/wikiskill/canonical_document.json
    gold: benchmarks/gold/wikiskill/entities.json

metrics:
  - precision
  - recall
  - f1

acceptance:
  - metric: precision
    operator: ">="
    target: 0.80

  - metric: recall
    operator: ">="
    target: 0.80

  - metric: f1
    operator: ">="
    target: 0.80

notes:
  - Fixture and gold data will be created before EntityExtractor implementation.
