[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-research-agent"
version = "0.1.0"
description = "Extensible persistent scientific research agent for arXiv"
requires-python = ">=3.8"
dependencies = [
  "playwright==1.48.0",
  "requests>=2.31,<3",
]

[project.scripts]
sciagent = "sciagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sciagent*"]
