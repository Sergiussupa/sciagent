schema_version: "0.1"

id: document_parser
name: Document Parser

layer: document_understanding
status: prototype

description: >
  Converts scientific PDF documents into a normalized document
  representation preserving page text and main document structure.
  Version 0.1 uses PyMuPDF as the primary backend and extracts
  title, abstract, pages and section headings.

inputs:
  - name: PDFDocument
    version: "0.1"

outputs:
  - name: CanonicalDocument
    version: "0.1"

depends_on: []

implementation:
  path: sciagent/document/parser.py
  exists: true

providers:
  - pymupdf
  - glm_ocr

models:
  - glm-ocr:latest

fixtures:
  - wikiskill.pdf
  - urbanground.pdf

acceptance:
  - metric: title_detection
    operator: ">="
    target: 0.95

  - metric: abstract_detection
    operator: ">="
    target: 0.95

  - metric: page_text_extraction
    operator: ">="
    target: 0.90

known_issues:
  - Tables and figures are not extracted in v0.1.
  - Python output model is not yet fully aligned with CanonicalDocument@0.1 contract.
  - GLM-OCR structure verification is experimental and disabled by default.
  - Fine-grained appendix structure is outside the v0.1 scope.

notes:
  - PyMuPDF is the primary parsing backend.
  - Main-paper structure is extracted through References.
  - WikiSkill and UrbanGround benchmark fixtures pass title, abstract, page count, text-anchor and required-section checks.
  - GLM-OCR remains available as an experimental extension point for future OCR and table extraction.
