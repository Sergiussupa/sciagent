schema_version: "0.1"

id: document_parser
name: Document Parser

layer: document_understanding
status: benchmark_defined

description: >
  Converts scientific PDF documents into a normalized canonical document
  representation preserving document structure, pages and text content.

inputs:
  - name: PDFDocument
    version: "0.1"

outputs:
  - name: CanonicalDocument
    version: "0.1"

depends_on: []

implementation:
  path: sciagent/document/parser.py
  exists: false

providers:
  - pymupdf
  - glm_ocr

models:
  - glm-ocr:latest

fixtures:
  - wikiskill.pdf
  - urbanground.pdf

acceptance:
  - metric: title_detection
    operator: ">="
    target: 0.95

  - metric: abstract_detection
    operator: ">="
    target: 0.95

  - metric: page_text_extraction
    operator: ">="
    target: 0.90

known_issues:
  - Tables and figures are not extracted in v0.1.

notes:
  - Future versions may add multimodal extraction.
